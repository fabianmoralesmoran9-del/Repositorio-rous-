<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Rous 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg-top: #cfe8d5;
    --bg-bottom: #f6edc8;
    --ink: #3b2a12;
    --sub: #6b5a3a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #0f2a24; --bg-bottom: #1d3a2b; --ink: #ffd84a; --sub: #e9d58a;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #0f2a24; --bg-bottom: #1d3a2b; --ink: #ffd84a; --sub: #e9d58a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font-family: "Dancing Script", "Brush Script MT", cursive;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; padding: 12px;
  }
  svg { width: min(92vw, 420px); max-height: 60vh; height: auto; overflow: visible; }

  /* Secuencia: papel -> tallos -> capullos -> pétalos uno a uno -> centro -> moño -> texto */
  .papel { opacity: 0; animation: subir 1s ease-out .1s forwards; }
  @keyframes subir { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }

  .tallo { stroke-dasharray: 420; stroke-dashoffset: 420; animation: crecer 1.1s ease-out forwards; }
  @keyframes crecer { to { stroke-dashoffset: 0; } }

  .hoja { transform: scale(0); animation: brotar .7s cubic-bezier(.2,.9,.3,1.3) forwards; }
  @keyframes brotar { to { transform: scale(1); } }

  .capullo { transform: scale(0); animation: capullo 1.3s ease-in-out forwards; }
  @keyframes capullo {
    0% { transform: scale(0); opacity: 1; }
    40% { transform: scale(1); opacity: 1; }
    75% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  .petalo { transform: scale(0); animation: abrir .85s cubic-bezier(.2,.9,.3,1.25) forwards; }
  @keyframes abrir { to { transform: scale(1); } }

  .centro { transform: scale(0); animation: brotar .7s cubic-bezier(.2,.9,.3,1.2) forwards; }
  .semillas { opacity: 0; animation: aparecer 1s ease-out forwards; }
  @keyframes aparecer { to { opacity: 1; } }

  .mecer { animation: mecer 3.6s ease-in-out infinite alternate; }
  @keyframes mecer { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }

  .mono { transform: scale(0); animation: pop .7s cubic-bezier(.2,.9,.3,1.5) 4.6s forwards; }
  @keyframes pop { to { transform: scale(1); } }

  .brillo { opacity: 0; animation: brillar 2.6s ease-in-out infinite; }
  @keyframes brillar {
    0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); }
    50% { opacity: 1; transform: scale(1) rotate(45deg); }
  }

  h1 {
    font-size: clamp(2.6rem, 12vw, 4.4rem); font-weight: 700;
    margin: 6px 0 0; text-align: center; min-height: 1.2em;
  }
  h1 span { display: inline-block; white-space: pre; opacity: 0; transform: translateY(14px) scale(.8);
            animation: letra .6s cubic-bezier(.2,.9,.3,1.3) forwards; }
  @keyframes letra { to { opacity: 1; transform: none; } }

  p { margin: 0; font-size: clamp(1.2rem, 5vw, 1.6rem); color: var(--sub); opacity: 0;
      animation: aparecer 1.2s ease-out 6.7s forwards; }
  button {
    margin-top: 10px; font: inherit; font-size: 1.1rem; color: var(--sub);
    background: transparent; border: 1.5px solid var(--sub); border-radius: 999px;
    padding: 4px 16px; cursor: pointer; opacity: 0;
    animation: aparecer 1s ease-out 7.6s forwards;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<svg id="ramo" viewBox="0 0 400 500" role="img" aria-label="Ramo de girasoles amarillos">
  <defs>
    <radialGradient id="centroG" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#7a4a1c"/><stop offset="1" stop-color="#3a1f08"/>
    </radialGradient>
    <linearGradient id="papelG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c98f"/><stop offset="1" stop-color="#c9a15f"/>
    </linearGradient>
  </defs>
  <g id="tallos"></g>
  <g id="hojas"></g>
  <g id="flores"></g>
  <g class="papel">
    <path d="M105 345 L295 345 L228 490 L172 490 Z" fill="url(#papelG)"/>
    <path d="M105 345 L200 470 L172 490 Z" fill="#b98c4a" opacity=".35"/>
    <path d="M105 345 Q200 375 295 345" fill="none" stroke="#a07a3c" stroke-width="2" opacity=".6"/>
  </g>
  <g transform="translate(200 395)">
    <g class="mono">
      <path d="M0 0 C-45 -28 -55 22 0 8 Z" fill="#d6336c"/>
      <path d="M0 0 C45 -28 55 22 0 8 Z" fill="#c2255c"/>
      <circle r="9" cy="4" fill="#e64980"/>
    </g>
  </g>
  <g id="brillos"></g>
</svg>

<h1 id="titulo" aria-label="te amooo Rous"></h1>
<p>🌻 para ti 🌻</p>
<button id="repetir" type="button">Ver de nuevo</button>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // x, y, radio
  var flores = [
    [200, 130, 74],
    [105, 195, 58],
    [295, 195, 58],
    [150, 270, 46],
    [250, 270, 46]
  ];
  var base = [200, 350];
  var TEXTO = "te amooo Rous";

  function construir() {
    ["tallos", "hojas", "flores", "brillos"].forEach(function (id) {
      document.getElementById(id).innerHTML = "";
    });
    var tallos = document.getElementById("tallos");
    var hojas = document.getElementById("hojas");
    var cont = document.getElementById("flores");
    var brillos = document.getElementById("brillos");

    flores.forEach(function (f, i) {
      var x = f[0], y = f[1], r = f[2];
      var tTallo = 0.7 + i * 0.3;        // el tallo empieza a crecer
      var t0 = tTallo + 1.0;             // el capullo aparece al llegar arriba

      // tallo
      var cx = (x + base[0]) / 2 + (x < base[0] ? -18 : 18);
      var p = el("path", {
        d: "M" + base[0] + " " + base[1] + " Q" + cx + " " + ((y + base[1]) / 2) + " " + x + " " + y,
        fill: "none", stroke: "#3f7d2e", "stroke-width": 6, "stroke-linecap": "round", "class": "tallo"
      }, tallos);
      p.style.animationDelay = tTallo + "s";

      // hoja
      if (i > 0) {
        var side = x < base[0] ? -1 : 1;
        var hx = base[0] + side * 34, hy = 330 - i * 4;
        var hg = el("g", { transform: "translate(" + hx + " " + hy + ")" }, hojas);
        var hp = el("path", {
          d: "M0 0 q" + (side * 30) + " -34 " + (side * 62) + " -16 q" + (side * -22) + " 34 " + (side * -62) + " 16 Z",
          fill: "#4f9a3a", "class": "hoja"
        }, hg);
        hp.style.animationDelay = (tTallo + 0.5) + "s";
      }

      // flor
      var g = el("g", { transform: "translate(" + x + " " + y + ")" }, cont);

      var cap = el("circle", { r: r * 0.28, fill: "#7fb241", "class": "capullo" }, g);
      cap.style.animationDelay = t0 + "s";

      var m = el("g", {}, g);
      m.setAttribute("class", "mecer");
      m.style.animationDelay = (t0 + 3) + "s";
      m.style.animationDuration = (3.2 + i * 0.4) + "s";

      function petalo(ang, escala, color, delay) {
        var s = r * escala;
        var o = el("g", { transform: "rotate(" + ang + ")" }, m);
        var pp = el("path", {
          d: "M0 " + (-s * 0.3) +
             " C" + (s * 0.3) + " " + (-s * 0.55) + " " + (s * 0.22) + " " + (-s * 0.98) + " 0 " + (-s * 1.08) +
             " C" + (-s * 0.22) + " " + (-s * 0.98) + " " + (-s * 0.3) + " " + (-s * 0.55) + " 0 " + (-s * 0.3) + " Z",
          fill: color, stroke: "#e39b00", "stroke-width": 0.8, "class": "petalo"
        }, o);
        pp.style.animationDelay = delay + "s";
      }
      var n = 20, tp = t0 + 0.5;
      for (var a = 0; a < n; a++) petalo((360 / n) * a + 9, 1.0, "#f5a800", tp + a * 0.04);
      for (var a2 = 0; a2 < n; a2++) petalo((360 / n) * a2, 0.94, "#ffd21f", tp + 0.2 + a2 * 0.04);

      var c = el("circle", { r: r * 0.46, fill: "url(#centroG)", "class": "centro" }, m);
      c.style.animationDelay = (tp + 0.8) + "s";

      var sem = el("g", { "class": "semillas" }, m);
      sem.style.animationDelay = (tp + 1.1) + "s";
      var total = Math.round(r * 1.1);
      for (var k = 1; k <= total; k++) {
        var rad = r * 0.42 * Math.sqrt(k / total);
        var th = k * 137.508 * Math.PI / 180;
        el("circle", {
          cx: (rad * Math.cos(th)).toFixed(2), cy: (rad * Math.sin(th)).toFixed(2),
          r: Math.max(0.9, r * 0.028), fill: "#231204", opacity: 0.55
        }, sem);
      }
    });

    // destellos dorados al final
    for (var s = 0; s < 14; s++) {
      var px = 50 + Math.random() * 300, py = 30 + Math.random() * 320;
      var sg = el("g", { transform: "translate(" + px.toFixed(0) + " " + py.toFixed(0) + ")" }, brillos);
      var st = el("path", {
        d: "M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z",
        fill: "#fff3a0", "class": "brillo"
      }, sg);
      st.style.animationDelay = (5.2 + Math.random() * 2.6).toFixed(2) + "s";
    }

    // texto letra por letra
    var h = document.getElementById("titulo");
    h.innerHTML = "";
    TEXTO.split("").forEach(function (ch, idx) {
      var sp = document.createElement("span");
      sp.textContent = ch;
      sp.style.animationDelay = (5.3 + idx * 0.09).toFixed(2) + "s";
      h.appendChild(sp);
    });
  }

  function reiniciar() {
    // reinicia las animaciones de todo el documento
    var nodos = document.querySelectorAll(".papel, .mono, p, button");
    nodos.forEach(function (n) {
      n.style.animation = "none";
      void n.getBoundingClientRect();
      n.style.animation = "";
    });
    construir();
  }

  document.getElementById("repetir").addEventListener("click", reiniciar);
  construir();
})();
</script>
</body>
</html>
